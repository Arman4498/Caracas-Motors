databases:
  - name: caracas-db
    plan: free
    databaseName: caracas
    user: caracas

services:
  - type: web
    name: caracas-motors
    runtime: node
    rootDir: src
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caracas-db
          property: connectionString
      - key: NODE_ENV
        value: production
