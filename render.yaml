services:
  - type: web
    name: caracas-motors
    runtime: node
    rootDir: src
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_PATH
        value: /var/data/caracas.db
    disk:
      name: caracas-data
      mountPath: /var/data
      sizeGB: 1
